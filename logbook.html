<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note My Coffee | Logbook</title>
    <meta name="description" content="원두별·날짜별로 쌓인 추출 기록. 원두가 바뀌는 날 지난 성공 세팅을 그대로 꺼내 쓰고, 레시피를 카드로 공유합니다.">

    <!-- 로그북은 개인 기록 화면이라 색인 대상이 아니지만, 링크를 붙였을 때
         회색 빈 박스로 뜨지 않도록 공유 카드는 채워둔다. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Note My Coffee">
    <meta property="og:locale" content="ko_KR">
    <meta property="og:url" content="https://note-my-coffee.web.app/logbook">
    <meta property="og:title" content="Note My Coffee — 레시피 로그북">
    <meta property="og:description" content="원두별·날짜별로 쌓인 추출 기록이 다음 다이얼링의 출발점이 됩니다.">
    <meta property="og:image" content="https://note-my-coffee.web.app/og-image.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Note My Coffee — 어제 내린 커피랑 오늘 내린 커피, 맛이 다르지 않으세요?">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Note My Coffee — 레시피 로그북">
    <meta name="twitter:description" content="원두별·날짜별로 쌓인 추출 기록이 다음 다이얼링의 출발점이 됩니다.">
    <meta name="twitter:image" content="https://note-my-coffee.web.app/og-image.png">

    <meta name="theme-color" content="#1C1410">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Note My Coffee">
    <script src="boot.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- IBM Plex 한 패밀리로 통일한다. Plex는 한글 정식 컷(Sans KR)이 있어 라틴과 한글이
         같은 체계로 붙는다 — 예전처럼 제목·본문·한글 서체를 따로 섞지 않는다.
         숫자는 전부 Plex Mono로 조판한다. 이 제품의 본질이 계측이기 때문이다. -->
    <!-- Pretendard(자체 호스팅). 동적 서브셋이라 페이지에 실제로 쓰인 글자 범위의
         woff2만 내려받는다. 동일 출처여서 서비스워커가 캐시 → 오프라인에서도 유지된다. -->
    <link rel="stylesheet" href="font/pretendard/pretendard.css">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell">
    <!-- 헤더 (app.html과 통일) -->
    <header class="app-header">
        <a href="index.html" class="brand" style="text-decoration: none;">
            <div class="brand-mark"><img src="logo-dark.svg" alt="Note My Coffee 로고"></div>
            <div class="brand-text">
                <span class="brand-name">Note My Coffee</span>
                <span class="brand-tagline">LOGBOOK</span>
            </div>
        </a>
        <div class="header-actions">
            <div class="lang-toggle">
                <button class="lang-btn active" id="l-en">EN</button>
                <button class="lang-btn" id="l-ko">KO</button>
            </div>
            <!-- PC용 새 레시피 버튼 (헤더에 위치) -->
            <button id="btn-new-recipe" class="logbook-btn primary-action-btn">
                <span id="lbl-new-recipe">+ NEW RECIPE</span>
            </button>
        </div>
    </header>

    <div class="console-box" id="logbook-container">
        <h2 class="logbook-title">나의 레시피 기록</h2>

        <!-- 검색 + 모드 필터. 기록이 있을 때만 logbook.js가 보여준다(hidden 해제). -->
        <div class="logbook-tools" id="logbook-tools" hidden>
            <div class="logbook-search">
                <svg class="lb-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input type="search" id="logbook-search" class="lb-search-input"
                       placeholder="원두명, 노트 검색…" autocomplete="off">
            </div>
            <div class="logbook-filters" id="logbook-filters">
                <button type="button" class="lb-chip is-active" data-mode="all">전체</button>
                <button type="button" class="lb-chip" data-mode="espresso">에스프레소</button>
                <button type="button" class="lb-chip" data-mode="drip">핸드드립</button>
            </div>
        </div>

        <div id="recipe-cards-grid">
            <!-- Recipe cards will be loaded here by logbook.js -->
        </div>
    </div>
</div>

<!-- 모바일용 플로팅 액션 버튼 (FAB) -->
<button id="mobile-fab" class="fab-btn" title="Create New Recipe">
    <span>+</span>
</button>

<!-- 하단 탭바 (모바일 전용) -->
<nav class="tab-bar" aria-label="주요 메뉴">
    <a href="app.html" class="tab-item" data-tab="brew">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M17 9h2a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-2"/><line x1="7" y1="3" x2="7" y2="5"/><line x1="11" y1="3" x2="11" y2="5"/></svg>
        <span>추출</span>
    </a>
    <a href="logbook.html" class="tab-item" data-tab="log">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        <span>기록</span>
    </a>
    <button type="button" class="tab-item" data-tab="settings" id="tab-settings-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>설정</span>
    </button>
</nav>

<!-- 설정 하단 시트 (버튼은 헤더 컨트롤에 위임. 로그북엔 없는 항목은 자동 숨김) -->
<div class="settings-sheet-overlay" id="settings-sheet" hidden>
    <div class="settings-sheet" role="dialog" aria-modal="true" aria-label="설정">
        <div class="settings-sheet-handle" aria-hidden="true"></div>
        <div class="settings-sheet-title">설정</div>
        <div class="settings-row">
            <span>언어</span>
            <div class="settings-seg">
                <button type="button" data-proxy="l-ko">KO</button>
                <button type="button" data-proxy="l-en">EN</button>
            </div>
        </div>
        <button type="button" class="settings-link" data-proxy="btn-help">서비스 가이드</button>
        <button type="button" class="settings-link" data-proxy="btn-login">로그인</button>
        <button type="button" class="settings-link" data-proxy="btn-logout">로그아웃</button>
        <a class="settings-link" href="delete-account.html">계정 · 데이터 삭제</a>
        <a class="settings-link" href="index.html">홈으로</a>
        <button type="button" class="settings-sheet-close" id="settings-sheet-close">닫기</button>
    </div>
</div>

<script type="module" src="logbook.js" defer></script>
<script src="tabbar.js" defer></script>
</body>
</html>
