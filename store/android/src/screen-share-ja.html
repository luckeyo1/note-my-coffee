<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../../font/pretendard/pretendard.css">
<style>
  :root{--mono:'IBM Plex Mono',ui-monospace,monospace;--body:'Pretendard Variable',Pretendard,system-ui,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:360px;font-family:var(--body);-webkit-font-smoothing:antialiased;
    background:#141019;background:radial-gradient(130% 80% at 50% 0%, #2A211A 0%, #14100C 60%, #0E0B08 100%);color:#EBE5DC}
  .wrap{padding:26px 20px 30px;min-height:780px;display:flex;flex-direction:column}
  .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .head h1{font-size:18px;font-weight:700}
  .x{width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.18);color:#B9B0A5;
    display:flex;align-items:center;justify-content:center;font-size:15px}
  .tabs{display:flex;gap:8px;margin-bottom:16px}
  .tab{flex:1;text-align:center;padding:9px 0;border-radius:11px;font-size:13px;font-weight:600;
    border:1px solid rgba(255,255,255,.14);color:#B9B0A5;background:rgba(255,255,255,.03)}
  .tab.on{background:rgba(200,169,110,.16);border-color:rgba(200,169,110,.5);color:#E7C9A0}
  .cardwrap{flex:1 1 auto;display:flex;align-items:center;justify-content:center;padding:4px 0 18px}
  .cardwrap img{width:100%;max-width:300px;border-radius:18px;display:block;
    box-shadow:0 30px 60px -22px rgba(0,0,0,.8),0 8px 20px -10px rgba(0,0,0,.6)}
  .acts{display:flex;gap:9px}
  .btn{flex:1;text-align:center;padding:13px 6px;border-radius:12px;font-size:13px;font-weight:600;
    border:1px solid rgba(255,255,255,.16);color:#EBE5DC;background:rgba(255,255,255,.05)}
  .btn.gold{background:#C8A96E;color:#20170E;border-color:#C8A96E}
</style>
</head>
<body>
  <div class="wrap">
    <div class="head"><h1>☕ この一杯をシェア</h1><span class="x">✕</span></div>
    <div class="tabs"><span class="tab on">🖼️ 写真背景</span><span class="tab">🗂️ カード</span></div>
    <div class="cardwrap"><img src="card-ja-story.png" alt="シェアカード"></div>
    <div class="acts"><span class="btn gold">↓ 画像を保存</span><span class="btn">↗ シェア</span><span class="btn">🔗 リンク</span></div>
  </div>
</body>
</html>
