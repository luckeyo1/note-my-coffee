<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Feature Graphic 1024x500</title>
<!--
  Google Play 피처 그래픽 원본 (1024x500, PNG).
  렌더: 리포지토리 루트에서 python http.server → /store/android/feature-graphic.html 를
  1024x500 뷰포트로 스크린샷 → store/android/feature-graphic.png.
  한글 폰트(Pretendard)는 리포지토리에 자체 호스팅돼 있어 그대로 렌더된다.
  안전 여백: 중요한 요소는 가장자리에서 80px 안쪽.
-->
<link rel="stylesheet" href="../../font/pretendard/pretendard.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --paper:#FCFAF6; --paper2:#F4F0E8; --ink:#241C15; --ink2:#5A4F44; --ink3:#7A6E60;
    --signal:#9E421D; --rule:rgba(36,28,21,0.16); --rule-soft:rgba(36,28,21,0.08);
    --sans:'Pretendard Variable',Pretendard,system-ui,sans-serif;
  }
  html, body { width:1024px; height:500px; overflow:hidden; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: var(--sans);
    display:flex; align-items:center; padding:0 88px; gap:52px; position:relative;
    -webkit-font-smoothing:antialiased;
  }
  /* 기록지 괘선(은은하게) */
  body::before{ content:''; position:absolute; inset:0; pointer-events:none;
    background-image: repeating-linear-gradient(to bottom, transparent 0 47px, var(--rule-soft) 47px 48px); }
  /* 오른쪽 아래 은은한 클레이 라디언스 */
  body::after{ content:''; position:absolute; right:-120px; bottom:-160px; width:520px; height:520px; border-radius:50%;
    background: radial-gradient(circle, rgba(158,66,29,0.10), transparent 68%); pointer-events:none; }

  .left { position:relative; z-index:1; flex:1 1 auto; }
  .mark { display:inline-flex; align-items:center; gap:12px; margin-bottom:20px; }
  .mark-dot { width:30px; height:30px; border-radius:50%; border:2.5px solid var(--signal); position:relative; flex:0 0 auto; }
  .mark-dot::after { content:''; position:absolute; inset:4px; border-radius:50%;
    background: conic-gradient(var(--signal) 0 62%, transparent 62% 100%); }
  .mark-label { font-size:13px; font-weight:600; letter-spacing:0.02em; color:var(--signal); }

  .name { font-size:68px; font-weight:800; line-height:1.0; letter-spacing:-0.03em; margin-bottom:18px; }
  .name em { font-style:normal; color:var(--signal); }
  .tag { font-size:21px; line-height:1.5; color:var(--ink2); max-width:20ch; word-break:keep-all; margin-bottom:24px; }

  .chips { display:flex; gap:8px; }
  .chip { font-size:13px; font-weight:600; color:var(--signal);
    background:rgba(158,66,29,0.08); border:1px solid rgba(158,66,29,0.28);
    border-radius:999px; padding:6px 14px; }

  .stats { position:relative; z-index:1; flex:0 0 auto; display:grid; grid-template-columns:repeat(2,134px); gap:14px; }
  .stat { background:var(--paper2); border:1px solid var(--rule); border-radius:14px; padding:16px 16px 14px; }
  .stat-k { font-size:11px; font-weight:600; letter-spacing:0.02em; color:var(--ink3); margin-bottom:9px; }
  .stat-v { font-size:31px; font-weight:800; line-height:1; letter-spacing:-0.02em; }
  .stat-v span { font-size:14px; font-weight:500; color:var(--ink3); margin-left:2px; }
  .stat-bar { height:3px; border-radius:2px; background:var(--rule); margin-top:12px; }
  .stat-bar i { display:block; height:100%; border-radius:2px; background:var(--signal); }
</style>
</head>
<body>
  <div class="left">
    <div class="mark"><div class="mark-dot"></div><div class="mark-label">바리스타가 만든 커피 기록</div></div>
    <div class="name">Note My <em>Coffee</em></div>
    <p class="tag">숫자 네 개, 30초.<br>어제의 완벽한 한 잔을 오늘 그대로.</p>
    <div class="chips"><span class="chip">기록</span><span class="chip">공유</span><span class="chip">둘러보기</span></div>
  </div>
  <div class="stats">
    <div class="stat"><div class="stat-k">도징</div><div class="stat-v">18.0<span>g</span></div><div class="stat-bar"><i style="width:62%"></i></div></div>
    <div class="stat"><div class="stat-k">물 온도</div><div class="stat-v">92.0<span>°C</span></div><div class="stat-bar"><i style="width:48%"></i></div></div>
    <div class="stat"><div class="stat-k">추출 시간</div><div class="stat-v">28<span>s</span></div><div class="stat-bar"><i style="width:55%"></i></div></div>
    <div class="stat"><div class="stat-k">추출량</div><div class="stat-v">36<span>g</span></div><div class="stat-bar"><i style="width:70%"></i></div></div>
  </div>
</body>
</html>
