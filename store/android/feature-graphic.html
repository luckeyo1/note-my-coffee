<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Feature Graphic 1024x500</title>
<!--
  Google Play 피처 그래픽 원본 (1024x500, PNG/JPEG).

  이 파일을 1024x500 뷰포트로 열어 스크린샷하면 store/android/feature-graphic.png가
  나온다. 한글 카피로 바꾸고 싶으면 아래 .name/.tag 텍스트를 고치고 한글 폰트가
  깔린 환경에서 다시 렌더하면 된다(빌드 샌드박스에는 한글 폰트가 없어 영문으로 뒀다).

  주의: 스토어 표면에 따라 가장자리가 잘리거나 UI가 겹칠 수 있다.
  중요한 요소는 가장자리에서 최소 80px 안쪽에 둔다.
-->
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* 브랜드 팔레트 — index.html :root와 같은 값 */
  :root {
    --paper:  #FCFAF6;
    --paper2: #F4F0E8;
    --ink:    #241C15;
    --ink2:   #5A4F44;
    --ink3:   #7A6E60;
    --signal: #9E421D;
    --rule:   rgba(36,28,21,0.16);
    --rule-soft: rgba(36,28,21,0.08);
  }

  html, body { width: 1024px; height: 500px; overflow: hidden; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'DejaVu Sans', 'Liberation Sans', system-ui, sans-serif;
    display: flex;
    align-items: center;
    /* 안전 여백 — 잘림에 대비해 88px */
    padding: 0 88px;
    gap: 56px;
    position: relative;
  }

  /* 기록지 괘선. 제품의 '노트' 정체성을 배경으로만 옅게 깐다. */
  body::before {
    content: '';
    position: absolute; inset: 0;
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0 47px,
      var(--rule-soft) 47px 48px
    );
    pointer-events: none;
  }

  .left { position: relative; z-index: 1; flex: 1 1 auto; }

  .mark {
    display: inline-flex; align-items: center; gap: 12px;
    margin-bottom: 22px;
  }
  .mark-dot {
    width: 30px; height: 30px; border-radius: 50%;
    border: 2.5px solid var(--signal);
    position: relative; flex: 0 0 auto;
  }
  /* 추출 게이지 — 원의 일부만 채워 '다이얼링 중'을 암시 */
  .mark-dot::after {
    content: ''; position: absolute; inset: 4px;
    border-radius: 50%;
    background: conic-gradient(var(--signal) 0 62%, transparent 62% 100%);
  }
  .mark-label {
    font-family: 'DejaVu Sans Mono', monospace;
    font-size: 12px; letter-spacing: 0.26em; text-transform: uppercase;
    color: var(--signal);
  }

  .name {
    font-family: 'Bitstream Charter', 'FreeSerif', Georgia, serif;
    font-size: 66px; font-weight: 400; line-height: 1.02;
    letter-spacing: -0.015em;
    margin-bottom: 20px;
  }
  .name em { font-style: normal; color: var(--signal); }

  .tag {
    font-size: 20px; line-height: 1.55; color: var(--ink2);
    max-width: 27ch;
  }

  /* 오른쪽: 제품의 정체성인 네 숫자 */
  .stats {
    position: relative; z-index: 1;
    flex: 0 0 auto;
    display: grid; grid-template-columns: repeat(2, 132px);
    gap: 14px;
  }
  .stat {
    background: var(--paper2);
    border: 1px solid var(--rule);
    border-radius: 12px;
    padding: 16px 16px 14px;
  }
  .stat-k {
    font-family: 'DejaVu Sans Mono', monospace;
    font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink3); margin-bottom: 8px;
  }
  .stat-v {
    font-size: 30px; font-weight: 700; line-height: 1;
    letter-spacing: -0.02em;
  }
  .stat-v span { font-size: 14px; font-weight: 400; color: var(--ink3); margin-left: 2px; }
  .stat-bar { height: 3px; border-radius: 2px; background: var(--rule); margin-top: 12px; }
  .stat-bar i { display: block; height: 100%; border-radius: 2px; background: var(--signal); }
</style>
</head>
<body>

  <div class="left">
    <div class="mark">
      <div class="mark-dot"></div>
      <div class="mark-label">Turn extraction into science</div>
    </div>
    <div class="name">Note My <em>Coffee</em></div>
    <p class="tag">Four numbers, thirty seconds — and yesterday's best cup is repeatable today.</p>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-k">Dosing</div>
      <div class="stat-v">18.0<span>g</span></div>
      <div class="stat-bar"><i style="width:62%"></i></div>
    </div>
    <div class="stat">
      <div class="stat-k">Water</div>
      <div class="stat-v">92.0<span>°C</span></div>
      <div class="stat-bar"><i style="width:48%"></i></div>
    </div>
    <div class="stat">
      <div class="stat-k">Time</div>
      <div class="stat-v">28<span>s</span></div>
      <div class="stat-bar"><i style="width:55%"></i></div>
    </div>
    <div class="stat">
      <div class="stat-k">Yield</div>
      <div class="stat-v">36<span>g</span></div>
      <div class="stat-bar"><i style="width:70%"></i></div>
    </div>
  </div>

</body>
</html>
