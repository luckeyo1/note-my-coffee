<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note My Coffee | Pro Barista</title>
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note My Coffee | Pro Barista</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="top-controls">
    <div class="mode-switch">
        <button id="btn-espresso" class="mode-btn active">ESPRESSO</button>
        <button id="btn-drip" class="mode-btn">HAND DRIP</button>
    </div>
    <div>
        <button class="lang-btn active" id="l-en">EN</button>
        <button class="lang-btn" id="l-ko">KO</button>
    </div>
    <button id="btn-view-logbook" class="mode-btn">VIEW LOGBOOK</button>
</div>

<div class="console-box">
    <div class="env-tag" id="weather-info">📍 SEOUL | ☀️ 18°C | 💧 45%</div>

    <!-- Dosing (Common) -->
    <div class="control-group">
        <div class="label-row">
            <span class="label-text" id="lbl-dosing">DOSING</span>
            <div class="value-display"><span id="v-dosing">18.0</span><span class="unit">g</span></div>
        </div>
        <input type="range" id="r-dosing" min="7" max="40" step="0.1" value="18">
    </div>

    <!-- Temp (Common) -->
    <div class="control-group">
        <div class="label-row">
            <span class="label-text" id="lbl-temp">TEMP</span>
            <div class="value-display"><span id="v-temp">92</span><span class="unit">°C</span></div>
        </div>
        <input type="range" id="r-temp" min="80" max="100" step="1" value="92">
    </div>

    <!-- Time (Dynamic) -->
    <div class="control-group">
        <div class="label-row">
            <span class="label-text" id="lbl-time">TIME</span>
            <div class="value-display"><span id="v-time">28.5</span><span class="unit" id="u-time">sec</span></div>
        </div>
        <input type="range" id="r-time" min="0" max="60" step="0.5" value="28.5">
    </div>

    <!-- Yield (Dynamic) -->
    <div class="control-group">
        <div class="label-row">
            <span class="label-text" id="lbl-yield">YIELD</span>
            <div class="value-display"><span id="v-yield">36</span><span class="unit">g</span></div>
        </div>
        <input type="range" id="r-yield" min="10" max="60" step="1" value="36">
    </div>

    <button class="save-btn" id="btn-save">LOG RECIPE</button>
</div>

<!-- Recipe Detail Modal -->
<div id="recipe-modal" class="modal">
    <div class="modal-content">
        <h3>레시피 상세 기록</h3>
        <div class="modal-form-group">
            <label for="modal-bean-name" id="lbl-modal-bean-name">원두 이름:</label>
            <input type="text" id="modal-bean-name" required>
        </div>
        <div class="modal-form-group">
            <label for="modal-purchase-url" id="lbl-modal-purchase-url">구매처 URL:</label>
            <input type="url" id="modal-purchase-url">
        </div>
        <div class="modal-form-group">
            <label for="modal-image-url" id="lbl-modal-image-url">원두 이미지 URL (선택):</label>
            <input type="url" id="modal-image-url">
        </div>
        <div class="modal-form-group">
            <label for="modal-taste-notes" id="lbl-modal-taste-notes">맛 노트:</label>
            <textarea id="modal-taste-notes"></textarea>
        </div>
        <div class="modal-form-group">
            <label id="lbl-modal-overall-rating">전체 평점:</label>
            <div class="rating-input" id="modal-overall-rating-container">
                <input type="radio" id="rating-5" name="overallRating" value="5"><label for="rating-5">★</label>
                <input type="radio" id="rating-4" name="overallRating" value="4"><label for="rating-4">★</label>
                <input type="radio" id="rating-3" name="overallRating" value="3" checked><label for="rating-3">★</label>
                <input type="radio" id="rating-2" name="overallRating" value="2"><label for="rating-2">★</label>
                <input type="radio" id="rating-1" name="overallRating" value="1"><label for="rating-1">★</label>
            </div>
        </div>
        <div class="modal-form-group">
            <label id="lbl-modal-success-fail">성공 / 실패:</label>
            <div class="success-fail-toggle">
                <input type="checkbox" id="modal-success-fail">
                <label for="modal-success-fail" class="toggle-label"></label>
            </div>
        </div>
        <div class="modal-actions">
            <button class="save-btn" id="modal-save-recipe">레시피 저장</button>
            <button class="cancel-btn" id="modal-cancel">취소</button>
        </div>
    </div>
</div>

<script src="storage.js"></script>
<script src="main.js" defer></script>

</body>
</html>
