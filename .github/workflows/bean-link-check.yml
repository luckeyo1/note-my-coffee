# 취향 검사 추천 원두 링크 주간 점검
#
# 매주 월요일 아침(KST 07:00) 스토어 검색 진입점이 살아있는지, 그리고 금지된
# 개별 상품 URL이 index.html에 다시 들어오지 않았는지 검사한다. 문제가 있으면
# Gemini CLI가 수정 PR을 올리고, 실패하면 백업으로 이슈를 생성해 신호를 남긴다.
#
# 사전 준비(1회): https://aistudio.google.com 에서 API 키 발급 후
# 저장소 Settings → Secrets and variables → Actions 에 GEMINI_API_KEY 로 등록.

name: bean-link-check

on:
  schedule:
    - cron: '0 22 * * 0' # UTC 일요일 22:00 = KST 월요일 07:00
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 추천 원두 링크 검사
        id: check
        run: |
          if node scripts/check-bean-links.mjs; then
            echo "dead=false" >> "$GITHUB_OUTPUT"
          else
            echo "dead=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Gemini로 대체 상품을 찾아 수정 PR 생성
        id: gemini
        if: steps.check.outputs.dead == 'true'
        continue-on-error: true
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            너는 note-my-coffee 저장소의 유지보수 에이전트다. 저장소 루트의 GEMINI.md 중
            "취향 검사 추천 원두 링크 유지보수" 섹션에 이 작업의 상세 규칙이 있다 — 반드시 따른다.

            상황: dead-links.json 에 문제 목록이 있다. detail 필드가 어느 쪽인지 말해준다.

            할 일:
            1. dead-links.json 을 읽는다. 문제는 두 종류뿐이다.
               (a) "금지된 링크 형태" — index.html 에 개별 상품 URL이 다시 들어왔다.
                   해당 원두를 query(검색어) 방식으로 되돌린다. 상품 URL을 살리려 하지 말 것.
               (b) 검색 진입점이 죽음 — 스토어가 검색 경로를 바꿨다는 뜻이다.
                   그 스토어의 현재 검색 URL 형식을 확인해 index.html 의 빌더
                   (kurlySearch / naverSearch)와 scripts/check-bean-links.mjs 의
                   ENTRY_POINTS 를 함께 고친다. 둘 중 하나만 고치면 검사만 통과하고
                   실제 링크는 죽은 채로 남는다.
            2. 상세 규칙은 GEMINI.md "취향 검사 추천 원두 링크 유지보수" 를 따른다.
            3. node scripts/check-bean-links.mjs 를 다시 실행해 통과하는지 확인한다.
            4. 브랜치 chore/bean-links-$(date +%Y%m%d) 를 만들어 커밋하고,
               gh CLI로 main 대상 PR을 연다. PR 본문에 무엇이 왜 깨졌는지 정리한다.

      - name: (백업) Gemini 실패 시 이슈 생성
        if: steps.check.outputs.dead == 'true' && steps.gemini.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "주간 링크 점검에서 죽은 상품 링크가 발견됐지만 자동 수리(PR)에 실패했습니다."
            echo ""
            echo '```json'
            cat dead-links.json
            echo '```'
            echo ""
            echo "index.html #quiz 섹션의 해당 상품을 수동으로 교체해주세요."
          } > issue-body.md
          gh issue create \
            --title "취향 검사 원두 링크 점검: 죽은 링크 $(date +%Y-%m-%d)" \
            --body-file issue-body.md
