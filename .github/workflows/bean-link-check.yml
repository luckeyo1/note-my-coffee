# 취향 검사 추천 원두 링크 주간 점검
#
# 매주 월요일 아침(KST 07:00) 상품 링크를 검사하고, 죽은 링크가 있으면
# Gemini CLI가 같은 취향 프로필에 맞는 대체 상품을 찾아 수정 PR을 올린다.
# Gemini가 실패하면 백업으로 이슈를 생성해 신호가 유실되지 않게 한다.
#
# 사전 준비(1회): https://aistudio.google.com 에서 API 키 발급 후
# 저장소 Settings → Secrets and variables → Actions 에 GEMINI_API_KEY 로 등록.

name: bean-link-check

on:
  schedule:
    - cron: '0 22 * * 0' # UTC 일요일 22:00 = KST 월요일 07:00
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 추천 원두 링크 검사
        id: check
        run: |
          if node scripts/check-bean-links.mjs; then
            echo "dead=false" >> "$GITHUB_OUTPUT"
          else
            echo "dead=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Gemini로 대체 상품을 찾아 수정 PR 생성
        id: gemini
        if: steps.check.outputs.dead == 'true'
        continue-on-error: true
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            너는 note-my-coffee 저장소의 유지보수 에이전트다. 저장소 루트의 GEMINI.md 중
            "취향 검사 추천 원두 링크 유지보수" 섹션에 이 작업의 상세 규칙이 있다 — 반드시 따른다.

            상황: dead-links.json 에 index.html 취향 검사(#quiz) 섹션의 죽은 상품 링크 목록이 있다.

            할 일:
            1. dead-links.json 을 읽고, index.html 의 RESULTS 데이터에서 해당 url 을 쓰는 항목을 찾는다.
            2. 죽은 링크마다 같은 취향 프로필에 맞는 유명 로스터리의 대체 상품을 찾는다
               (탐색 방법은 GEMINI.md 참고 — 컬리 게스트 API / 홈바리스타클럽 카테고리 크롤링).
            3. 대체 상품 URL이 실제로 HTTP 200으로 열리는지 curl 로 확인한다.
            4. index.html 에서 해당 항목의 name / roaster / desc / url 을 새 상품에 맞게
               일관되게 수정한다. 다른 코드는 절대 건드리지 않는다.
            5. node scripts/check-bean-links.mjs 를 다시 실행해 전부 통과하는지 확인한다.
            6. 브랜치 chore/bean-links-$(date +%Y%m%d) 를 만들어 커밋하고,
               gh CLI로 main 대상 PR을 연다. PR 본문에 "죽은 링크 → 대체 상품" 매핑을 표로 정리한다.

      - name: (백업) Gemini 실패 시 이슈 생성
        if: steps.check.outputs.dead == 'true' && steps.gemini.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "주간 링크 점검에서 죽은 상품 링크가 발견됐지만 자동 수리(PR)에 실패했습니다."
            echo ""
            echo '```json'
            cat dead-links.json
            echo '```'
            echo ""
            echo "index.html #quiz 섹션의 해당 상품을 수동으로 교체해주세요."
          } > issue-body.md
          gh issue create \
            --title "취향 검사 원두 링크 점검: 죽은 링크 $(date +%Y-%m-%d)" \
            --body-file issue-body.md
