# 갤럭시 워치(Wear OS) 앱 빌드 검사
#
# wear/ 아래가 바뀌면 디버그 APK를 빌드하고 lint를 돌린다. 만든 APK는
# 아티팩트로 올려두니, 실기기에 바로 설치해볼 수 있다(wear/README.md).
#
# 화면 스크린샷(Roborazzi — 에뮬레이터 없이 JVM에서 실제 Compose 화면을 그린다)도
# 만든다. main이 아닌 브랜치에서 store/wear/*.png가 바뀌면 그 브랜치에 커밋해둔다
# (아티팩트를 못 받는 환경에서도 git으로 화면을 볼 수 있게. Play Wear OS 스크린샷 겸용).
#
# google-services.json은 저장소에 넣지 않는다. 시크릿 WEAR_GOOGLE_SERVICES_JSON에
# 파일 전문을 등록하면 그걸로 빌드하고(실제 Firebase에 붙는 APK), 없으면 컴파일
# 검사용 자리표시 파일을 만든다 — 그 APK는 설치는 되지만 Firebase에 접속하지 못한다.

name: wear-build

on:
  # 모든 브랜치 — 워치 작업 브랜치에서도 PR 전에 빌드를 확인한다(wear/만 바뀔 때).
  push:
    paths: ['wear/**', '.github/workflows/wear-build.yml']
  workflow_dispatch: {}

permissions:
  contents: write # 스크린샷 커밋

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wear
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: google-services.json
        env:
          GSJ: ${{ secrets.WEAR_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then
            printf '%s' "$GSJ" > app/google-services.json
            echo "real=true" >> "$GITHUB_ENV"
          else
            echo "::warning::WEAR_GOOGLE_SERVICES_JSON 시크릿이 없어 자리표시 파일로 빌드합니다(컴파일 검사용)."
            cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "note-my-coffee",
              "storage_bucket": "note-my-coffee.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": { "package_name": "app.web.note_my_coffee" }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "placeholder" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Build + lint + unit tests
        run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug :app:testDebugUnitTest

      - name: Screenshots (Roborazzi)
        run: ./gradlew --no-daemon :app:recordRoborazziDebug

      # GITHUB_TOKEN으로 한 푸시는 워크플로를 다시 돌리지 않으므로 루프가 생기지 않는다.
      - name: Commit screenshots
        if: github.ref_name != 'main'
        working-directory: .
        run: |
          git add store/wear
          if git diff --cached --quiet; then echo "스크린샷 변경 없음"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "wear: 스크린샷 갱신 (CI)"
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "::warning::브랜치가 앞서 있어 스크린샷을 푸시하지 못했습니다(다음 실행에서 다시 시도)."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wear-debug
          path: |
            wear/app/build/outputs/apk/debug/*.apk
            wear/app/build/reports/lint-results-debug.html
            store/wear/*.png
          if-no-files-found: ignore
