# Firebase Hosting 자동 배포
#
# main에 병합되면 라이브(note-my-coffee.web.app)로 배포하고,
# PR이 열리면 임시 미리보기 URL을 만들어 PR에 댓글로 남긴다.
# 병합 전에 실제 URL로 확인할 수 있어서 "배포해봐야 아는" 상황을 없앤다.
#
# 이 워크플로는 **hosting만** 배포한다. Firestore 보안 규칙은 콘솔에서 직접
# 관리하고 있으므로(ADMIN.md 참고) 여기서 절대 건드리지 않는다 —
# firebase.json에도 rules가 연결돼 있지 않다.
#
# 사전 준비(1회): 저장소 Settings → Secrets and variables → Actions 에
# FIREBASE_SERVICE_ACCOUNT 로 서비스 계정 JSON 전문을 등록한다.
# 가장 쉬운 발급 방법은 로컬에서 `firebase init hosting:github` 를 실행하는 것
# (시크릿을 자동 등록해준다). 이때 워크플로 파일을 새로 만들겠다고 하면
# 이 파일과 중복되니, 생성된 firebase-hosting-*.yml 은 지우고 이 파일을 쓴다.

name: firebase-hosting

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  # ── 시크릿 유무 확인 ───────────────────────────────────────────────
  # 시크릿이 없을 때 배포 액션은 "Input required and not supplied"로 하드 실패한다.
  # 그건 코드 결함이 아니라 설정 미완이므로 PR을 빨갛게 만들면 신호가 잘못된다.
  # 대신 건너뛰되 경고 주석을 남겨 '해야 할 일'로는 계속 보이게 한다.
  # (secrets 컨텍스트는 job-level if에서 못 쓰므로 step에서 읽어 output으로 넘긴다)
  preflight:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$SA" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Firebase 시크릿 미설정::FIREBASE_SERVICE_ACCOUNT가 없어 배포를 건너뜁니다. 로컬 또는 Firebase Studio에서 'firebase init hosting:github'를 실행해 등록하세요."
          fi

  # ── 라이브 배포: main 병합 또는 수동 실행 ──────────────────────────
  live:
    needs: preflight
    if: needs.preflight.outputs.configured == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 라이브 채널로 배포
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ github.token }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: note-my-coffee
          channelId: live

  # ── PR 미리보기: 임시 URL을 만들어 PR에 댓글로 남긴다 ──────────────
  # 포크에서 온 PR은 시크릿을 못 받아 실패하는 게 정상이다(의도된 보안 동작).
  preview:
    needs: preflight
    if: needs.preflight.outputs.configured == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: 미리보기 채널로 배포
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ github.token }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: note-my-coffee
          # channelId 생략 = PR별 임시 채널 (기본 7일 후 만료)
