<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>원두 텔레파시 — 지금 당신이 마시고 싶은 그 맛, 커피가 먼저 알아요</title>

    <!-- 공유 카드. 카카오톡·트위터·슬랙에 링크를 붙였을 때 회색 빈 박스로 뜨지 않게 한다.
         og:*는 property=, twitter:*는 name=. og:image는 반드시 절대 URL.
         전용 썸네일이 생기기 전까지는 서비스 공용 og-image를 재사용한다. -->

    <meta property="og:site_name" content="Note My Coffee">
    <meta property="og:locale" content="ko_KR">
    <meta property="og:url" content="https://note-my-coffee.web.app/telepathy">
    <meta property="og:title" content="원두 텔레파시 — 지금 마시고 싶은 그 맛, 커피가 먼저 알아요">
    <meta property="og:description" content="눈을 감고 떠올려 보세요. 30초 교신으로 운명의 원두가 당신을 찾아옵니다.">
    <meta property="og:image" content="https://note-my-coffee.web.app/og-image.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="원두 텔레파시 — Note My Coffee">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="원두 텔레파시 — 지금 마시고 싶은 그 맛, 커피가 먼저 알아요">
    <meta name="twitter:description" content="눈을 감고 떠올려 보세요. 30초 교신으로 운명의 원두가 당신을 찾아옵니다.">
    <meta name="twitter:image" content="https://note-my-coffee.web.app/og-image.png">

    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script src="boot.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="font/pretendard/pretendard.css">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- 결과 프로필 아트는 교신 애니메이션 동안 미리 받아 둔다(결과 화면 깜빡임 방지). -->
    <link rel="prefetch" href="img/profile-a.webp" as="image">

    <style>
    /* ===== 원두 텔레파시 — 독립 몰입 경험 =====
       서비스 본문(크림색 종이)과 달리 이 페이지는 '특별한 교신'을 위해 에스프레소
       어두운 세계로 둔다. 팔레트는 style.css 토큰 규율을 그대로 지킨다:
       어두운 표면 위 액센트는 --clay-on-dark(#D8794E, #241C15 위 5.40:1)만 쓰고,
       밝은 배경 전용인 --gold/--gold-light는 여기 올리지 않는다. */
    :root {
        --esp-0: #1A120C;   /* 가장 깊은 배경 */
        --esp-1: #241C15;   /* 에스프레소 잉크 (토큰의 --ink) */
        --esp-2: #2E251D;   /* 떠 있는 표면 */
        --cream: #FCFAF6;
        --muted: #B8A896;   /* 어두운 배경 위 본문 보조 (약 7:1) */
        --ghost: #8A7B6B;
        --clay: #D8794E;    /* 액센트 — 어두운 표면 전용 안전값 */
        --clay-soft: #E8A074;
        --line: rgba(252,250,246,0.12);
        --line-2: rgba(252,250,246,0.18);
        --font: 'Pretendard Variable', Pretendard, system-ui, -apple-system, sans-serif;
        --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace;
        --ease: cubic-bezier(0.4, 0, 0.2, 1);
        --spring: cubic-bezier(0.34, 1.3, 0.4, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

    body {
        font-family: var(--font);
        color: var(--cream);
        background: var(--esp-0);
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
        overflow-x: hidden;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        position: relative;
    }

    /* 배경: 위쪽에서 번지는 따뜻한 교신 글로우 + 미세한 비네팅 */
    body::before {
        content: '';
        position: fixed;
        inset: 0;
        background:
            radial-gradient(120% 70% at 50% -10%, rgba(216,121,78,0.18), transparent 60%),
            radial-gradient(100% 100% at 50% 120%, rgba(216,121,78,0.06), transparent 55%),
            linear-gradient(180deg, var(--esp-1), var(--esp-0));
        z-index: -1;
    }

    .stage {
        width: 100%;
        max-width: 460px;
        margin: auto;
        text-align: center;
        animation: scene-in 0.5s var(--ease) both;
    }
    @keyframes scene-in {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: none; }
    }

    .eyebrow {
        font-family: var(--mono);
        font-size: 12px;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--clay);
        margin-bottom: 18px;
    }

    h1 {
        font-size: clamp(30px, 8.5vw, 40px);
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.24;
        margin-bottom: 18px;
    }
    .lede {
        font-size: 15px;
        color: var(--muted);
        max-width: 34ch;
        margin: 0 auto 34px;
    }

    /* ===== 텔레파시 시그널(인트로·교신 공용) ===== */
    .signal {
        position: relative;
        width: 190px;
        height: 190px;
        margin: 8px auto 34px;
        display: grid;
        place-items: center;
    }
    .signal .ring {
        position: absolute;
        inset: 0;
        border: 1.5px solid var(--clay);
        border-radius: 50%;
        opacity: 0;
        animation: ping 3s var(--ease) infinite;
    }
    .signal .ring:nth-child(2) { animation-delay: 1s; }
    .signal .ring:nth-child(3) { animation-delay: 2s; }
    @keyframes ping {
        0%   { transform: scale(0.35); opacity: 0.9; }
        70%  { opacity: 0.08; }
        100% { transform: scale(1); opacity: 0; }
    }
    .signal .core {
        position: relative;
        width: 78px;
        height: 78px;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 38%, var(--clay-soft), var(--clay) 70%);
        display: grid;
        place-items: center;
        font-size: 34px;
        box-shadow: 0 0 44px rgba(216,121,78,0.5);
        animation: breathe 3s ease-in-out infinite;
    }
    @keyframes breathe {
        0%, 100% { transform: scale(1); }
        50%      { transform: scale(1.07); }
    }

    /* ===== 버튼 ===== */
    .btn {
        font-family: var(--font);
        font-size: 16px;
        font-weight: 600;
        border: none;
        cursor: pointer;
        padding: 16px 30px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: transform 0.2s var(--spring), background 0.2s var(--ease), opacity 0.2s;
        width: 100%;
        max-width: 320px;
    }
    .btn-primary {
        background: var(--clay);
        color: var(--esp-1);
    }
    .btn-primary:hover { transform: translateY(-2px); background: var(--clay-soft); }
    .btn-primary:active { transform: translateY(0); }
    .btn-ghost {
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--line-2);
    }
    .btn-ghost:hover { color: var(--cream); border-color: var(--clay); }
    .btn:disabled { opacity: 0.6; cursor: default; transform: none; }

    .micro {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.1em;
        color: var(--ghost);
        margin-top: 18px;
    }

    /* ===== 질문 ===== */
    .progress {
        display: flex;
        gap: 6px;
        max-width: 320px;
        margin: 0 auto 30px;
    }
    .progress span {
        flex: 1;
        height: 3px;
        background: var(--line);
        transition: background 0.4s var(--ease);
    }
    .progress span.on { background: var(--clay); }

    .q {
        font-size: clamp(21px, 6vw, 26px);
        font-weight: 700;
        letter-spacing: -0.01em;
        line-height: 1.4;
        margin-bottom: 26px;
    }
    .opts { display: flex; flex-direction: column; gap: 11px; }
    .opt {
        font-family: var(--font);
        font-size: 15.5px;
        font-weight: 500;
        color: var(--cream);
        text-align: left;
        background: rgba(252,250,246,0.045);
        border: 1px solid var(--line);
        padding: 17px 19px;
        cursor: pointer;
        transition: transform 0.18s var(--spring), background 0.18s, border-color 0.18s;
        display: flex;
        align-items: center;
        gap: 13px;
    }
    .opt:hover, .opt:focus-visible {
        background: rgba(216,121,78,0.1);
        border-color: var(--clay);
        transform: translateX(4px);
        outline: none;
    }
    .opt .ic { font-size: 20px; flex-shrink: 0; width: 24px; text-align: center; }
    .back {
        background: none;
        border: none;
        color: var(--ghost);
        font-family: var(--font);
        font-size: 13px;
        cursor: pointer;
        margin-top: 22px;
        padding: 6px;
    }
    .back:hover { color: var(--muted); }

    /* ===== 교신 중 ===== */
    .transmit-msg {
        font-family: var(--mono);
        font-size: 13px;
        letter-spacing: 0.12em;
        color: var(--clay-soft);
        min-height: 1.4em;
        animation: msg-flicker 0.4s var(--ease);
    }
    @keyframes msg-flicker { from { opacity: 0.2; } to { opacity: 1; } }

    /* ===== 결과 ===== */
    /* 운명의 원두 히어로 이미지. 서비스의 프로필 일러스트(어두운 정물)를 '현상된
       사진'처럼 액자에 담는다. 브랜드 규율상 라운드는 사진에만 허용되므로 14px.
       3:2로 잘라 세로 높이를 줄이고, 피사체가 아래쪽에 있어 object-position을 내린다. */
    .result-art {
        width: 100%;
        aspect-ratio: 3 / 2;
        object-fit: cover;
        object-position: 50% 62%;
        border-radius: 14px;
        display: block;
        margin: 0 auto 22px;
        border: 1px solid var(--line);
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        animation: art-in 0.7s var(--ease) both;
    }
    @keyframes art-in {
        from { opacity: 0; transform: scale(0.97); filter: blur(6px); }
        to   { opacity: 1; transform: none; filter: none; }
    }
    .result-persona { font-size: 46px; margin-bottom: 6px; line-height: 1; }
    .result-kicker {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: var(--clay);
        margin-bottom: 10px;
    }
    .result-title {
        font-size: clamp(27px, 7.5vw, 34px);
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 14px;
    }
    .sync {
        display: inline-flex;
        align-items: baseline;
        gap: 7px;
        font-family: var(--mono);
        font-size: 12px;
        letter-spacing: 0.08em;
        color: var(--muted);
        border: 1px solid var(--line-2);
        padding: 7px 14px;
        margin-bottom: 24px;
    }
    .sync b { font-size: 17px; color: var(--clay-soft); font-weight: 600; }

    .quote {
        position: relative;
        font-size: 16px;
        line-height: 1.75;
        color: var(--cream);
        background: rgba(252,250,246,0.045);
        border: 1px solid var(--line);
        border-left: 3px solid var(--clay);
        padding: 20px 22px;
        text-align: left;
        margin-bottom: 26px;
    }
    .quote .from {
        display: block;
        margin-top: 12px;
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.08em;
        color: var(--ghost);
    }

    .flavor-radar { width: 190px; height: 190px; display: block; margin: 0 auto 8px; }
    .fr-grid line, .fr-grid polygon { stroke: rgba(216,121,78,0.22); stroke-width: 1; }
    .fr-shape { fill: rgba(216,121,78,0.2); stroke: var(--clay-soft); stroke-width: 2; }
    .fr-dot circle { fill: var(--clay-soft); }
    .fr-label text {
        fill: var(--muted);
        font-family: var(--mono);
        font-size: 11px;
        text-anchor: middle;
    }

    .desc { font-size: 14.5px; color: var(--muted); line-height: 1.8; margin-bottom: 20px; }
    .tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; margin-bottom: 28px; }
    .tag {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.04em;
        color: var(--clay-soft);
        border: 1px solid var(--line-2);
        padding: 5px 11px;
    }

    .section-label {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--ghost);
        text-align: left;
        margin-bottom: 12px;
    }
    .beans { display: flex; flex-direction: column; gap: 12px; margin-bottom: 30px; }
    .bean {
        text-align: left;
        background: rgba(252,250,246,0.045);
        border: 1px solid var(--line);
        padding: 17px 18px;
    }
    .bean-name { font-size: 15.5px; font-weight: 700; margin-bottom: 3px; }
    .bean-roaster { font-family: var(--mono); font-size: 11px; color: var(--clay-soft); margin-bottom: 8px; letter-spacing: 0.04em; }
    .bean-desc { font-size: 13px; color: var(--muted); line-height: 1.65; margin-bottom: 13px; }
    .bean-links { display: flex; gap: 8px; }
    .bean-link {
        flex: 1;
        text-align: center;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--cream);
        text-decoration: none;
        border: 1px solid var(--line-2);
        padding: 9px;
        transition: border-color 0.18s, color 0.18s, background 0.18s;
    }
    .bean-link:hover { border-color: var(--clay); color: var(--clay-soft); background: rgba(216,121,78,0.08); }

    /* 결과 하단 CTA(제품 복귀) */
    .cta-box {
        background: linear-gradient(180deg, rgba(216,121,78,0.14), rgba(216,121,78,0.04));
        border: 1px solid var(--line-2);
        padding: 24px 22px;
        margin-bottom: 18px;
    }
    .cta-box p { font-size: 14px; color: var(--cream); line-height: 1.7; margin-bottom: 18px; }
    .cta-box .btn { margin: 0 auto; }

    /* 리드 옵트인 */
    .lead { margin-bottom: 20px; }
    .lead-head { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    .lead-desc { font-size: 12.5px; color: var(--ghost); margin-bottom: 12px; line-height: 1.6; }
    .lead-form { display: flex; gap: 8px; }
    .lead-input {
        flex: 1;
        font-family: var(--font);
        font-size: 14px;
        color: var(--cream);
        background: rgba(252,250,246,0.05);
        border: 1px solid var(--line-2);
        padding: 12px 14px;
    }
    .lead-input::placeholder { color: var(--ghost); }
    .lead-input:focus { outline: none; border-color: var(--clay); }
    .lead-btn {
        font-family: var(--font);
        font-size: 14px;
        font-weight: 600;
        color: var(--esp-1);
        background: var(--muted);
        border: none;
        padding: 12px 18px;
        cursor: pointer;
        transition: background 0.18s;
    }
    .lead-btn:hover { background: var(--cream); }
    .lead-msg { font-size: 12px; color: var(--clay-soft); margin-top: 9px; min-height: 1.2em; text-align: left; }

    .actions { display: flex; flex-direction: column; gap: 11px; margin-bottom: 18px; }
    .footnote { font-size: 11px; color: var(--ghost); line-height: 1.6; }
    .footnote a { color: var(--muted); }

    .home-link {
        position: fixed;
        top: max(16px, env(safe-area-inset-top));
        left: 18px;
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.08em;
        color: var(--ghost);
        text-decoration: none;
        z-index: 5;
        transition: color 0.18s;
    }
    .home-link:hover { color: var(--clay-soft); }

    @media (prefers-reduced-motion: reduce) {
        .stage, .signal .ring, .signal .core, .opt, .btn, .transmit-msg, .result-art { animation: none !important; transition: none !important; }
        .result-art { filter: none !important; }
        .signal .ring { opacity: 0.25; }
    }
    </style>
</head>
<body>
    <a class="home-link" href="index.html">← Note My Coffee</a>
    <main class="stage" id="stage" aria-live="polite"></main>

    <!-- 경험 본체는 '클래식' 스크립트다(모듈 아님). Firebase/계측 모듈 로드가
         실패해도(오프라인·CDN 차단) 교신·결과 화면은 끝까지 동작해야 하기 때문이다.
         계측·리드 저장은 아래 모듈이 window.nmcTrack / window.nmcSaveLead로 주입하며,
         없으면 조용히 건너뛴다(firebase-config.js의 '전환 동선을 끌고 내려가지 않는다' 규율). -->
    <script>
    (function () {
    /* ── 교신은 '느낌'을 읽는다 ──────────────────────────────────────────────
       지식 질문(산미 몇 %?)이 아니라 지금의 기분·장면을 묻는다 — 그게 '텔레파시'의
       연출이다. 각 선택지는 서비스의 4가지 취향 아키타입(A~D)에 매핑되고, 최다 득표
       프로필이 index.html의 취향 검사와 같은 원두 추천으로 이어진다. */
    const QUESTIONS = [
        { q: '눈을 감았어요. 지금 가장 먼저 떠오른 장면은?', opts: [
            ['ic:☀️', '창문으로 쏟아지는 아침 햇살', 'A'],
            ['ic:🌤', '좋아하는 사람과의 나른한 오후', 'B'],
            ['ic:🛋', '담요 두르고 보는 영화 한 편', 'C'],
            ['ic:🌙', '혼자 집중하는 깊은 밤', 'D'],
        ]},
        { q: '지금 손이 먼저 가는 한 입은?', opts: [
            ['ic:🍑', '갓 딴 과일 한 조각', 'A'],
            ['ic:🥐', '잘 구운 빵 한 입', 'B'],
            ['ic:🍮', '달콤한 디저트', 'C'],
            ['ic:🍫', '다크초콜릿 한 조각', 'D'],
        ]},
        { q: '오늘의 나를 색으로 고른다면?', opts: [
            ['ic:🪸', '맑고 투명한 코랄', 'A'],
            ['ic:🟤', '따뜻한 베이지', 'B'],
            ['ic:🧈', '포근한 카라멜', 'C'],
            ['ic:⬛', '짙은 에스프레소', 'D'],
        ]},
        { q: '지금 가장 듣고 싶은 소리는?', opts: [

    const FLAVOR_AXES = ['산미', '단맛', '바디', '로스팅'];

    const stage = document.getElementById('stage');

    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    function show(html) {
        stage.style.animation = 'none';

        void stage.offsetWidth;

    /* ── 인트로 ── */
    function renderIntro() {
        show(
            '<div class="eyebrow">Bean Telepathy · 원두 텔레파시</div>' +
            '<div class="signal" aria-hidden="true">' +
            '<div class="ring"></div><div class="ring"></div><div class="ring"></div>' +
            '<div class="core">☕</div></div>' +
            '<h1>지금 마시고 싶은 그 맛,<br>커피가 먼저 알아요</h1>' +
            '<p class="lede">눈을 감고 떠올려 보세요. 당신이 지금 바라는 한 잔을, 운명의 원두가 텔레파시로 찾아옵니다.</p>' +
            '<button class="btn btn-primary" id="start">교신 시작하기 →</button>' +
            '<p class="micro">30초 · 로그인 없이</p>'
        );
        document.getElementById('start').addEventListener('click', () => {
            window.nmcTrack && window.nmcTrack('telepathy_start');
            step = 0; answers.length = 0;

        });
    }

    /* ── 질문 ── */
    function renderQuestion() {
        const Q = QUESTIONS[step];
        show(
            '<div class="progress">' +
            QUESTIONS.map((_, i) => '<span' + (i <= step ? ' class="on"' : '') + '></span>').join('') +
            '</div>' +
            '<div class="q">' + esc(Q.q) + '</div>' +
            '<div class="opts">' +
            Q.opts.map((o, i) =>
                '<button type="button" class="opt" data-i="' + i + '">' +
                '<span class="ic" aria-hidden="true">' + esc(o[0].replace('ic:', '')) + '</span>' +
                '<span>' + esc(o[1]) + '</span></button>').join('') +
            '</div>' +
            (step > 0 ? '<button type="button" class="back" id="back">← 이전</button>' : '')
        );
        stage.querySelectorAll('.opt').forEach((btn) =>
            btn.addEventListener('click', () => {
                if (!startSent) { startSent = true; /* start는 버튼에서 이미 보냄 */ }
                answers[step] = Q.opts[+btn.dataset.i][2];
                step += 1;
                if (step < QUESTIONS.length) renderQuestion(); else renderTransmit();
            }));
        const back = document.getElementById('back');
        if (back) back.addEventListener('click', () => { step -= 1; renderQuestion(); });
    }

    /* 득표 최다 프로필(동점이면 A→B→C→D 순 먼저). 교신 중 프리로드와 결과가 공유한다. */
    function winningKey() {
        const counts = {};
        answers.forEach((k) => { counts[k] = (counts[k] || 0) + 1; });
        return ['A', 'B', 'C', 'D'].reduce((best, k) => (counts[k] || 0) > (counts[best] || 0) ? k : best, 'A');
    }
    const artSrc = (key) => 'img/profile-' + String(key).toLowerCase() + '.webp';

    /* ── 교신 중(리드 연출) ── */
    function renderTransmit() {
        // 결과 히어로 이미지를 교신 애니메이션 동안 미리 받아둔다 — 결과 전환 시 깜빡이지 않게.
        const key = winningKey();
        new Image().src = artSrc(key);
        show(
            '<div class="eyebrow">Transmitting…</div>' +
            '<div class="signal" aria-hidden="true">' +
            '<div class="ring"></div><div class="ring"></div><div class="ring"></div>' +
            '<div class="core">📡</div></div>' +
            '<p class="transmit-msg" id="tmsg">' + esc(TRANSMIT_LINES[0]) + '</p>'
        );
        const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const msgEl = document.getElementById('tmsg');
        let li = 0;
        const total = reduce ? 500 : 2800;
        const timer = setInterval(() => {
            li += 1;
            if (li < TRANSMIT_LINES.length && msgEl) {
                msgEl.textContent = TRANSMIT_LINES[li];
                msgEl.style.animation = 'none'; void msgEl.offsetWidth; msgEl.style.animation = '';
            }
        }, total / TRANSMIT_LINES.length);
        setTimeout(() => { clearInterval(timer); renderResult(); }, total);
    }

    /* ── 플레이버 레이더(어두운 배경용으로 톤만 조정, 로직은 취향 검사와 동일) ── */
    function flavorRadar(v) {
        const C = 100, R = 58;
        const pt = (i, s) => {
            const a = -Math.PI / 2 + i * Math.PI / 2;
            return [C + Math.cos(a) * R * s, C + Math.sin(a) * R * s];
        };
        const poly = (s) => [0, 1, 2, 3].map((i) => pt(i, s).map((n) => n.toFixed(1)).join(',')).join(' ');
        const grid = [0.25, 0.5, 0.75, 1].map((s) => '<polygon points="' + poly(s) + '" fill="none"/>').join('');
        const spokes = [0, 1, 2, 3].map((i) => {
            const [x, y] = pt(i, 1);
            return '<line x1="100" y1="100" x2="' + x.toFixed(1) + '" y2="' + y.toFixed(1) + '"/>';
        }).join('');
        const shape = v.map((s, i) => pt(i, s).map((n) => n.toFixed(1)).join(',')).join(' ');
        const dots = v.map((s, i) => { const [x, y] = pt(i, s); return '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="3"/>'; }).join('');
        const labels = FLAVOR_AXES.map((t, i) => { const [x, y] = pt(i, 1.34); return '<text x="' + x.toFixed(1) + '" y="' + (y + 3.6).toFixed(1) + '">' + t + '</text>'; }).join('');
        return '<svg class="flavor-radar" viewBox="0 0 200 200" role="img" aria-label="' +
            FLAVOR_AXES.map((t, i) => t + ' ' + Math.round(v[i] * 100) + '%').join(', ') + '">' +
            '<g class="fr-grid">' + grid + spokes + '</g>' +
            '<polygon class="fr-shape" points="' + shape + '"/>' +
            '<g class="fr-dot">' + dots + '</g>' +
            '<g class="fr-label">' + labels + '</g></svg>';
    }

    /* ── 결과 ── */
    function renderResult() {

        const sync = Math.round(72 + ((counts[key] || 0) / answers.length) * 27);

        show(

            // 정물)가 이 페이지 배경과 같은 톤이라 그대로 녹아든다. 로드 실패 시 아래

            '</div>' +
            '<div class="cta-box">' +
            '<p>운명의 원두를 만났다면, 첫 한 잔부터 기록해보세요.<br>도징·온도·시간만 남기면 다음 잔이 쉬워집니다.</p>' +
            '<button type="button" class="btn btn-primary" id="cta">무료로 기록 시작하기 →</button>' +
            '</div>' +
            '<div class="lead">' +
            '<div class="lead-head">☕ 취향에 맞는 원두, 계속 받아볼래요?</div>' +
            '<p class="lead-desc">새로 나온 추천 원두와 다이얼링 팁을 이메일로. 스팸 없이, 언제든 해지할 수 있어요.</p>' +
            '<form class="lead-form" id="lead-form" novalidate>' +
            '<input type="email" class="lead-input" id="lead-email" placeholder="이메일 주소" autocomplete="email" inputmode="email" required>' +
            '<button type="submit" class="lead-btn" id="lead-btn">받기</button>' +
            '</form>' +
            '<p class="lead-msg" id="lead-msg" role="status" aria-live="polite"></p>' +

            '<button type="button" class="btn btn-ghost" id="restart">다시 교신하기 ↺</button>' +
            '</div>' +
            '<p class="footnote">각 스토어의 검색 결과로 연결됩니다. 판매처·가격·재고는 그때그때 다를 수 있어요. ' +
            '싱크로율은 재미를 위한 연출 지표입니다. · <a href="index.html">Note My Coffee</a></p>'
        );

        window.nmcTrack && window.nmcTrack('telepathy_complete', { profile: key, profile_title: r.title, sync });

        // 히어로 이미지가 없으면(아트 누락·오프라인) 빈 액자 대신 이모지 배지로 대체한다.
        const artEl = document.getElementById('result-art');
        if (artEl) artEl.addEventListener('error', () => {
            artEl.remove();
            const p = document.getElementById('result-persona');

        // 원두 링크 클릭 — 제휴 수익화 판단 지표(취향 검사와 동일 이벤트명)

            const b = r.beans[Number(a.dataset.bean)];

        // 공유 카드 — 취향 검사와 같은 share-card.js를 첫 클릭에서만 받는다.
        const shareBtn = document.getElementById('share');

            const original = shareBtn.textContent;
            shareBtn.disabled = true;
            shareBtn.textContent = '카드 만드는 중…';
            try {
                const { shareQuizCard } = await import('./share-card.js');
                const method = await shareQuizCard({ profile: key, title: r.title, tags: r.tags, flavor: r.flavor });
                window.nmcTrack && window.nmcTrack('telepathy_share', { profile: key, method });
                shareBtn.textContent = original;
            } catch (e) {
                console.error('[Telepathy] 공유 카드를 만들지 못했습니다.', e);
                shareBtn.textContent = '다시 시도해주세요';
                setTimeout(() => { shareBtn.textContent = original; }, 2400);
            } finally {
                shareBtn.disabled = false;

        });

        // 리드 옵트인 — leads 컬렉션 저장은 아래 모듈이 주입한 window.nmcSaveLead가 맡는다.
        // 모듈이 아직/영영 안 떠 있으면(계측 오프라인) 조용히 안내만 한다.
        const form = document.getElementById('lead-form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('lead-email');
            const btn = document.getElementById('lead-btn');
            const msg = document.getElementById('lead-msg');
            const email = (input.value || '').trim().toLowerCase();
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) || email.length > 190) {
                msg.textContent = '이메일 주소를 다시 확인해주세요.';
                return;
            }
            if (!window.nmcSaveLead) {
                msg.textContent = '잠시 후 다시 시도해주세요.';
                return;
            }
            btn.disabled = true; input.disabled = true;
            try {
                await window.nmcSaveLead({ email, source: 'telepathy', profile: key, profileTitle: r.title });
                window.nmcTrack && window.nmcTrack('lead_submit', { source: 'telepathy', profile: key });
                form.style.display = 'none';
                msg.textContent = '등록됐어요. 좋은 원두로 찾아올게요 ☕';
            } catch (err) {
                console.error('[Telepathy] 리드 저장 실패', err);
                btn.disabled = false; input.disabled = false;
                msg.textContent = '잠시 후 다시 시도해주세요.';
            }
        });
    }

    renderIntro();
    })();
    </script>

    <!-- 계측·리드 저장 주입(모듈). 실패해도 위 경험에는 영향이 없다. -->
    <script type="module">
    import { track, bumpVisit, db, doc, setDoc } from './firebase-config.js';
    window.nmcTrack = track;
    // 리드는 leads 컬렉션에 쌓인다(규칙상 누구나 생성, 관리자만 읽음). 이메일을
    // FNV-1a 해시한 값을 문서 ID로 삼아 같은 사람이 다시 남겨도 중복되지 않는다.
    window.nmcSaveLead = async (lead) => {
        const email = String((lead && lead.email) || '').trim().toLowerCase();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) || email.length > 190) throw new Error('invalid-email');
        let h = 0x811c9dc5;
        for (let i = 0; i < email.length; i++) { h ^= email.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
        await setDoc(doc(db, 'leads', 'l' + h.toString(36)), {
            email,
            source: (lead && lead.source) || 'telepathy',
            profile: (lead && lead.profile) || '',
            profileTitle: (lead && lead.profileTitle) || '',
            createdAt: new Date().toISOString(),
            path: location.pathname,
        }, { merge: true });
    };
    // 진입 계측 — GA4 + 관리자 대시보드(Firestore)용 방문 집계
    track('telepathy_view');
    bumpVisit('telepathy');
    </script>
